spring.datasource.url=jdbc:postgresql://localhost:5432/expirelog_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.expirelog.entity

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

member.expire.strategy=RESET
member.expire.grace-days=7

member.reminder.enabled=true
member.reminder.days-before-expire=7
member.reminder.batch-size=100
member.reminder.default-channels=SMS,EMAIL
member.reminder.daily.enabled=true
member.reminder.daily.cron=0 0 9 * * ?
member.reminder.weekly.enabled=true
member.reminder.weekly.cron=0 0 9 ? * MON
member.reminder.monthly.enabled=true
member.reminder.monthly.cron=0 0 9 1 * ?
